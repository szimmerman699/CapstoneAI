[project]
name = "capstone-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "szimmerman699", email = "szimmerman699@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "fastembed>=0.8.0",
    "httpx>=0.27.0,<1.0",
    "langchain-text-splitters>=1.0.0",
    "pinecone>=5.0.0",
    "pydantic>=2.5.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0,<2.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
capstone-ai = "capstone_ai:main"



[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # whatever your server actually needs
]
[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
